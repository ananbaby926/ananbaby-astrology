<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>神機妙算安安貝比</title><style>*{box-sizing:border-box}body{margin:0;background:#faf7f0;color:#695548;font:16px/1.7 system-ui,sans-serif}main{max-width:680px;margin:auto;padding:24px}header{text-align:center;padding:30px 0}h1{font-size:30px;margin:8px}small{color:#826e5e}section{background:#fffdfa;border:1px solid #e7dacb;border-radius:24px;padding:24px;margin:16px 0}label{display:block;margin:12px 0}input,select,button{font:inherit;border:1px solid #d9c9b7;border-radius:12px;padding:10px;width:100%;background:#faf7f0;color:inherit}button{background:#80664f;color:white;cursor:pointer;margin-top:12px}input[type=checkbox]{width:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}details{margin-top:20px}article{border-bottom:1px solid #e7dacb;padding:12px 0}button:disabled{opacity:.5}</style></head><body><main><header><small>✧ LIFE ATLAS ✧</small><h1>神機妙算安安貝比</h1><p>西洋占星 · 八字 · 紫微斗數</p><small>內部測試版｜目前僅測試資料提交與管理員登入</small></header><section><h2>建立命盤資料</h2><p>請先使用虛構測試資料。排盤及命理解讀尚未開放。</p><form id="profile"><label>暱稱<input name="nickname" required maxlength="80"></label><label>出生日期<input name="birth_date" type="date" required></label><label>出生時間<input name="birth_time" type="time" required></label><label>排盤性別<select name="gender"><option value="female">女</option><option value="male">男</option></select></label><label>出生地<input name="birth_place" required maxlength="200"></label><label>時區<input name="timezone" value="Asia/Taipei" required></label><label><input type="checkbox" required> 我同意將測試資料儲存於雲端，供網站管理員查看及測試。</label><button>提交測試資料</button></form><p id="status" role="status"></p></section><section><details><summary>管理員登入</summary><form id="login"><label>Email<input name="email" type="email" required></label><label>密碼<input name="password" type="password" required></label><button>登入</button></form><p id="adminStatus" role="status"></p><div id="panel" hidden><button id="refresh">重新整理資料</button><button id="logout">登出</button><div id="records"></div></div></details></section></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://zqnjytqhwzjybjhvrxvo.supabase.co','sb_publishable_yZs9f2JUumaOE5TfCFsQrw_U4vcuEzu',{auth:{persistSession:false}});const $=id=>document.getElementById(id);const msg=(id,s)=>$(id).textContent=s;
$('profile').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const data=Object.fromEntries(new FormData(e.target));new Intl.DateTimeFormat('en',{timeZone:data.timezone});const {error}=await db.from('birth_profiles').insert({...data,consent:true});if(error)throw error;msg('status','測試資料已提交');e.target.reset()}catch(err){msg('status','提交失敗：'+err.message)}finally{b.disabled=false}};
async function load(){const {data,error}=await db.from('birth_profiles').select('nickname,birth_date,birth_time,gender,birth_place,timezone,created_at').order('created_at',{ascending:false}).limit(100);$('records').replaceChildren();if(error){msg('adminStatus',error.message);return}msg('adminStatus','最近 '+data.length+' 筆資料（最多100筆）');for(const r of data){const a=document.createElement('article');a.textContent=[r.nickname,r.birth_date,r.birth_time,r.gender,r.birth_place,r.timezone].join(' ｜ ');$('records').append(a)}}
$('login').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const {data,error}=await db.auth.signInWithPassword(f);e.target.reset();if(error){msg('adminStatus','登入失敗：'+error.message);return}const check=await db.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(check.error||!check.data){await db.auth.signOut();msg('adminStatus','沒有管理員權限');return}$('panel').hidden=false;$('login').hidden=true;await load()};$('refresh').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();$('records').replaceChildren();$('panel').hidden=true;$('login').hidden=false;msg('adminStatus','已登出')};
</script></body></html>

</style></head><body><main><header><small class="hero">✦ DESTINY & ASTROLOGY ✦</small><h1>神機妙算安安貝比</h1><p>西洋占星 · 八字 · 紫微斗數</p><div class="wheel" aria-hidden="true">☾</div><p>四柱、大運、流年與流月試算</p><a class="cta" href="#entry">開啟我的專屬命盤</a><small>第九版八字測試｜傳統文化參考</small></header><div class="features"><div class="feature"><b>八字命理</b><small>完整四柱・大運流年</small><a href="#entry">開始試算</a></div><div class="feature"><b>紫微斗數</b><small>十二宮・星曜｜開發中</small></div><div class="feature"><b>西洋占星</b><small>星盤・相位｜開發中</small></div></div><section id="entry"><h2>建立命盤資料</h2><p>請使用虛構測試資料。八字試算在瀏覽器內進行，不需上傳；雲端提交須另行同意。</p><form id="profile"><label>暱稱<input name="nickname" required maxlength="80"></label><label>出生日期<input name="birth_date" type="date" required></label><label>出生時間<input name="birth_time" type="time" step="1" required></label><label>排盤性別<select name="gender"><option value="female">女</option><option value="male">男</option></select></label><label>出生地<input name="birth_place" required maxlength="200"></label><label>時區<input name="timezone" value="Asia/Taipei" required></label><label><input id="consent" type="checkbox"> 我同意將測試資料儲存於雲端，供網站管理員查看及測試。</label><button type="button" id="calculate">試算八字（不儲存）</button><button type="submit">提交測試資料</button></form><p id="status" role="status"></p><div id="chart" role="status"></div></section><section><details><summary>管理員登入</summary><form id="login"><label>Email<input name="email" type="email" required></label><label>密碼<input name="password" type="password" required></label><button>登入</button></form><p id="adminStatus" role="status"></p><div id="panel" hidden><button id="refresh">重新整理資料</button><button id="logout">登出</button><div id="records"></div></div></details></section><footer>隱私說明：僅在勾選同意並提交後將表單資料傳送至 Supabase，供管理員測試查看。請勿輸入真實個資。命理不具科學預測效力。</footer></main><script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script><script>
const stems='甲乙丙丁戊己庚辛壬癸', branches='子丑寅卯辰巳午未申酉戌亥';
const groups=['甲乙寅卯','丙丁巳午','戊己辰戌丑未','庚辛申酉','壬癸亥子'], classes=['wood','fire','earth','metal','water'], names=['木','火','土','金','水'], colors=['#43865B','#CF4545','#795039','#C2A56D','#3265B5'];
const hidden=['癸','己癸辛','甲丙戊','乙','戊乙癸','丙戊庚','丁己','己丁乙','庚壬戊','辛','戊辛丁','壬甲'];
const el=c=>groups.findIndex(g=>g.includes(c));
function god(day,c){const a=el(day),b=el(c),same=stems.indexOf(day)%2===stems.indexOf(c)%2;return [['比肩','劫財'],['食神','傷官'],['偏財','正財'],['七殺','正官'],['偏印','正印']][(b-a+5)%5][same?0:1]}
function node(tag,t,cls){const n=document.createElement(tag);n.textContent=t;if(cls)n.className=cls;return n}
function colored(c){return node('strong',c,classes[el(c)])}
function heading(out,t){out.append(node('h3',t,'charthead'))}
function note(out,t){out.append(node('p',t,'note'))}
// 八字核心開始
const pillarKeys = ['Year', 'Month', 'Day', 'Time'];
const labels = ['年柱', '月柱', '日支夫妻宮', '時柱', '大運', '流年', '流月'];
const branchStems = branch => [...hidden[branches.indexOf(branch)]];
const parent = element => (element + 4) % 5;
const roundScore = value => Math.max(0, Math.min(100, Math.round(value)));

const relationRules = [
  ['天干五合', '甲己:2 乙庚:3 丙辛:4 丁壬:0 戊癸:1', 0],
  ['六合', '子丑:2 寅亥:0 卯戌:1 辰酉:3 巳申:4 午未:2', 1],
  ['三合', '申子辰:4 亥卯未:0 寅午戌:1 巳酉丑:3', 1],
  ['三會', '寅卯辰:0 巳午未:1 申酉戌:3 亥子丑:4', 1],
  ['六沖', '子午 丑未 寅申 卯酉 辰戌 巳亥', 1],
  ['刑', '子卯 寅巳申 丑戌未 辰辰 午午 酉酉 亥亥', 1],
  ['破', '子酉 丑辰 寅亥 卯午 巳申 未戌', 1],
  ['害', '子未 丑午 寅巳 卯辰 申亥 酉戌', 1]
];

function relations(pillars) {
  const hits = [];
  for (const [kind, rules, column] of relationRules) {
    for (const rule of rules.split(' ')) {
      const [symbols, target] = rule.split(':');
      function match(offset, slots) {
        if (offset === symbols.length) {
          hits.push({kind, symbols, slots, target: target === undefined ? null : Number(target)});
          return;
        }
        pillars.forEach((pillar, index) => {
          if (pillar?.[column] !== symbols[offset] || slots.includes(index)) return;
          if (symbols[offset] === symbols[offset - 1] && index < slots.at(-1)) return;
          if (column === 0 && slots.length && index < 4 && slots[0] < 4 && Math.abs(index - slots[0]) !== 1) return;
          match(offset + 1, [...slots, index]);
        });
      }
      match(0, []);
    }
  }
  const season = el(branchStems(pillars[1][1])[0]);
  for (const hit of hits.filter(hit => hit.target !== null)) {
    const stemJoin = hit.kind === '天干五合';
    const independentStem = pillars.some((pillar, index) => pillar && el(pillar[0]) === hit.target &&
      (!stemJoin || !hit.slots.includes(index)));
    const contested = hits.some(other => other !== hit && other.target !== null &&
      (other.kind === '天干五合') === stemJoin && other.slots.some(index => hit.slots.includes(index)) &&
      (other.target !== hit.target || other.kind === hit.kind));
    const clash = hits.some(other => other.kind === '六沖' && other.slots.some(index => hit.slots.includes(index)));
    const retainsRoot = stemJoin && hit.slots.some(index => el(pillars[index][0]) !== hit.target &&
      pillars.some((pillar, position) => pillar && position < 4 && branchStems(pillar[1]).includes(pillars[index][0])));
    const blockers = [
      season !== hit.target && '化神未得原局月令',
      !independentStem && '化神未獨立透干',
      contested && '有爭合或化向衝突',
      clash && '組合位置受沖',
      retainsRoot && '參與天干仍有原局本根'
    ].filter(Boolean);
    hit.transforms = blockers.length === 0;
    hit.reason = blockers.join('、') || '化神得月令且透干，未見爭合、沖或本根牽制';
  }
  return hits;
}

function describe(hit) {
  return hit.symbols + hit.kind + '（' + hit.slots.map(index => labels[index]).join('、') + '）' +
    (hit.target === null ? '' : '，' + (hit.transforms ? '本模型判化' + names[hit.target] : '合而未化') + '：' + hit.reason);
}

// 冷熱及乾濕以月支為起點，再由原局火、水、燥土、濕土修正。
// 數值是本站公開的規則權重，並非曆法資料或古籍原文。
const seasonalClimate = [
  [-3, -2], [-3, -2], [-2, -1], [-1, -1], [0, -2], [2, 1],
  [3, 2], [2, 3], [1, 1], [0, 2], [-1, 3], [-3, -2]
];

function natalModel(pillars) {
  const day = pillars[2][0];
  const self = el(day);
  const weights = Array(5).fill(0);
  const gods = {};
  const roots = [];
  const visible = pillars.map(pillar => pillar[0]);
  const monthStems = branchStems(pillars[1][1]);
  const hits = relations(pillars);
  function add(stem, weight, element = el(stem)) {
    weights[element] += weight;
    gods[god(day, stem)] = (gods[god(day, stem)] || 0) + weight;
  }
  pillars.forEach(([stem, branch], index) => {
    const stemChange = hits.find(hit => hit.transforms && hit.kind === '天干五合' && hit.slots.includes(index));
    const branchChange = hits.find(hit => hit.transforms && hit.kind !== '天干五合' && hit.slots.includes(index));
    if (index !== 2) add(stem, 1, stemChange?.target);
    branchStems(branch).forEach((hiddenStem, rank, all) => {
      const fractions = [[1], [.7, .3], [.6, .25, .15]][all.length - 1];
      add(hiddenStem, fractions[rank] * (index === 1 ? 3 : 1), branchChange?.target);
      if (el(hiddenStem) === self) roots.push(labels[index] + hiddenStem + (rank === 0 ? '本氣' : '餘氣'));
    });
  });
  const support = (weights[self] + weights[parent(self)]) / 9;
  const monthElement = el(monthStems[0]);
  const command = [self, parent(self)].includes(monthElement);
  const allies = visible.filter((stem, index) => index !== 2 && [self, parent(self)].includes(el(stem))).length;
  const dominant = weights.indexOf(Math.max(...weights));
  const state = support >= .59 ? '身強' : support <= .41 ? '身弱' : '中和';
  const exposed = monthStems.filter(stem => visible.some((item, index) => index !== 2 && item === stem));
  const lead = exposed[0] || monthStems[0];
  const ordinary = {'比肩':'比劫月令', '劫財':'比劫月令'}[god(day, lead)] || god(day, lead) + '格候選';
  const special = !roots.length && !allies && support <= .12 && weights[dominant] >= 4.5
    ? ({1:'從兒', 2:'從財', 3:'從殺'}[(dominant - self + 5) % 5] || '')
    : command && roots.length >= 3 && support >= .88 && dominant === self && weights[self] >= 6
      ? ['曲直', '炎上', '稼穡', '從革', '潤下'][self] + '專旺' : '';
  const [monthHeat, monthDryness] = seasonalClimate[branches.indexOf(pillars[1][1])];
  const heat = monthHeat + .38 * (weights[1] - weights[4]);
  const drySoil = pillars.filter(pillar => '未戌'.includes(pillar[1])).length;
  const wetSoil = pillars.filter(pillar => '丑辰'.includes(pillar[1])).length;
  const dryness = monthDryness + .25 * (weights[1] - weights[4]) + .45 * (drySoil - wetSoil);
  const climate = Array(5).fill(0);
  if (heat <= -1.4) climate[1] += 1.8;
  if (heat >= 1.4) climate[4] += 1.8;
  if (dryness >= 1.4) climate[4] += 1.1;
  if (dryness <= -1.4) climate[1] += 1.1;
  const balance = state === '身弱' ? [parent(self), self] :
    state === '身強' ? [(self + 1) % 5, (self + 2) % 5, (self + 3) % 5] : [];
  const balanceScore = weights.map((weight, element) => {
    if (special.includes('專旺')) return element === self ? 3 : element === parent(self) ? 1.8 : -1.6;
    if (special) return element === dominant ? 3 : element === parent(dominant) ? 1.5 : -1.7;
    return balance.includes(element) ? 2 - balance.indexOf(element) * .25 :
      balance.length ? -1.6 : (1.8 - weight) * .4;
  });
  const preference = balanceScore.map((value, index) => value + climate[index]);
  const priority = [...preference.keys()].sort((a, b) => preference[b] - preference[a]);
  return {pillars, day, weights, gods, roots, command, allies, state, support, monthStems, exposed,
    special, ordinary, heat, dryness, climate, balanceScore, preference, priority, hits};
}

function chartModel(birth, gender) {
  const ec = birth.getLunar().getEightChar();
  ec.setSect(2);
  const model = natalModel(pillarKeys.map(key => ec['get' + key]()));
  const yun = ec.getYun(gender === 'male' ? 1 : 0, 2);
  const start = yun.getStartSolar();
  const periods = yun.getDaYun(23).slice(1).map((period, index) => ({
    pillar: period.getGanZhi(), start: start.nextYear(index * 10), end: start.nextYear((index + 1) * 10)
  }));
  return {...model, birth, gender, periods, forward: yun.isForward(), start};
}

const keyOf = solar => solar.toYmdHms();
const activeLuck = (model, solar) => model.periods.find(period =>
  keyOf(period.start) <= keyOf(solar) && keyOf(solar) < keyOf(period.end));

const jieNames = ['立春','驚蟄','清明','立夏','芒種','小暑','立秋','白露','寒露','立冬','大雪','小寒'];
const lunarJie = ['立春','惊蛰','清明','立夏','芒种','小暑','立秋','白露','寒露','立冬','大雪','小寒'];
const solarTermsCache = new Map();
function solarTerms(year) {
  if (!solarTermsCache.has(year)) {
    const table = Solar.fromYmdHms(year, 7, 1, 12, 0, 0).getLunar().getJieQiTable();
    const next = Solar.fromYmdHms(year + 1, 7, 1, 12, 0, 0).getLunar().getJieQiTable();
    solarTermsCache.set(year, [...lunarJie.map((term, index) => (index === 11 ? next : table)[term]), next['立春']]);
  }
  return solarTermsCache.get(year);
}

function slices(model, start, end) {
  if (keyOf(end) <= keyOf(model.birth)) return [];
  const first = keyOf(start) < keyOf(model.birth) ? model.birth : start;
  const boundaries = [first, ...model.periods.map(period => period.start)
    .filter(solar => keyOf(first) < keyOf(solar) && keyOf(solar) < keyOf(end)), end];
  return boundaries.slice(0, -1).map((solar, index) => ({start: solar, end: boundaries[index + 1]}));
}

const pressure = {'六沖': 5, '刑': 3, '害': 2.5, '破': 2};
const tenGods = ['比肩','劫財','食神','傷官','偏財','正財','七殺','正官','偏印','正印'];
const starSignal = {
  比肩: ['獨立接案', '拒絕讓別人參與決策', '讓合作方在簽約前檢查分工'],
  劫財: ['共同開發客源', '為了人情先代墊或承諾分潤', '先用書面確認分潤和退場條件'],
  食神: ['把一項做得好的服務做成可重複交付的產品', '花太久打磨細節而延後交付', '先約定可驗收的交付日期'],
  傷官: ['提案改善現有流程', '當眾指出別人失誤卻沒有替案', '私下拿實例和替代方案談變更'],
  偏財: ['用小規模試單開發新客群', '把未到帳的承諾算進支出預算', '先訂試單成本上限和收款日'],
  正財: ['整理可持續的收入和續約條件', '為了維持熟悉的收入接受不划算的工時', '把收入、工時和額外支出放在同一張表'],
  七殺: ['接下一項界線清楚的難案', '在期限壓力下答應超出權限的條件', '先確認決策權、支援人力和交付範圍'],
  正官: ['用成果爭取明確職責或考核機會', '先接責任再談資源和授權', '在接任前寫下權責和評估標準'],
  偏印: ['用專門技能完成小型驗證', '一直改做法卻遲遲不交付', '設定一個驗證期限與停止條件'],
  正印: ['帶著具體難題向專業人士請教', '等所有人同意才開始', '約定討論後當週要完成的一項行動']
};

const domains = [
  ['事業','正官 七殺 傷官 食神',[1,3], '用一件可驗收的成果談職責'],
  ['財富','正財 偏財',[1,2], '把已收款、應收款及固定支出分開記'],
  ['正財','正財 正官',[1,2], '談清楚續約、底薪或固定佣金的條件'],
  ['偏財','偏財 食神 傷官',[1,2], '先用可負擔損失的小額試單驗證需求'],
  ['感情','正財 正官 食神',[2], '先談兩人共同時間、花費和家人界線'],
  ['創業','食神 傷官 偏財 劫財',[1,3], '先完成一輪有實際收款的小規模驗證'],
  ['升遷','正官 七殺 正印',[1], '整理可量化成果後再談權限和資源'],
  ['貴人','正印 偏印 正官',[0,1], '帶一個具體問題找有實務經驗的人討論'],
  ['置產','正財 正印',[2,3], '先列自備款、持有費和收入下降時的緩衝'],
  ['負債','正財 七殺 劫財',[2,3], '逐筆列月付、利率和還款日再考慮新承諾'],
  ['個性與弱點','比肩 劫財 傷官 偏印',[2], '重大決策前請一位敢提出異議的人檢查'],
  ['天賦','食神 傷官 偏印',[1,3], '挑一項有回饋的技能持續做出作品'],
  ['婚姻與伴侶','正官 七殺 正財 偏財',[2], '觀察對方能否守約並願意協商分工'],
  ['家庭','正印 偏印 正財',[0,1,2], '分清照顧責任、可支配時間與費用'],
  ['子女與教養','食神 傷官 正官',[3], '先問清楚孩子卡在哪裡，再定可以做到的要求'],
  ['人際與合作','比肩 劫財 傷官',[0,1], '用書面約定合作界線、收款與退場']
];

function reading(model, solar, {monthly = false, yearAnchor = solar} = {}) {
  const luck = activeLuck(model, solar)?.pillar;
  const year = yearAnchor.getLunar().getEightChar().getYear();
  const month = monthly ? solar.getLunar().getEightChar().getMonth() : null;
  const pillars = [...model.pillars, luck, year, month];
  const hits = relations(pillars).filter(hit => hit.slots.some(index => index >= 4));
  const stars = Object.fromEntries(tenGods.map(star => [star, (model.gods[star] || 0) * .55]));
  const movement = Array(5).fill(0);
  const multipliers = [1.3, 1, .64];
  for (let index = 4; index < pillars.length; index++) {
    if (!pillars[index]) continue;
    const [stem, branch] = pillars[index];
    const stemChange = hits.find(hit => hit.transforms && hit.kind === '天干五合' && hit.slots.includes(index));
    const branchChange = hits.find(hit => hit.transforms && hit.kind !== '天干五合' && hit.slots.includes(index));
    for (const [letter, intensity, change] of [[stem, 1, stemChange], [branchStems(branch)[0], .8, branchChange]]) {
      const element = change?.target ?? el(letter);
      movement[element] += intensity * multipliers[index - 4];
      stars[god(model.day, letter)] += intensity * multipliers[index - 4];
    }
  }
  const fit = movement.reduce((sum, weight, element) => sum + weight * model.preference[element], 0);
  const tension = hits.reduce((sum, hit) => sum + (pressure[hit.kind] || 0), 0);
  const base = 62 + fit * 2.7 - tension * .85;
  const scores = domains.map(([label, targets, houses, action]) => {
    const partner = model.gender === 'male' ? ['正財', '偏財'] : ['正官', '七殺'];
    const candidates = (label === '婚姻與伴侶' ? partner : targets.split(' '))
      .sort((a, b) => stars[b] - stars[a]);
    const star = candidates[0];
    const ties = hits.filter(hit => hit.slots.some(index => houses.includes(index)));
    const friction = ties.reduce((sum, hit) => sum + (pressure[hit.kind] || 0), 0);
    const benefit = ties.reduce((sum, hit) => sum + (hit.transforms ? model.preference[hit.target] * 1.7 : 0), 0);
    const score = roundScore(base + (stars[star] - 1.6) * 4 + benefit - friction * 1.35);
    const [opportunity, mistake, correction] = starSignal[star];
    const mainTie = [...ties].sort((a, b) => (pressure[b.kind] || 0) - (pressure[a.kind] || 0))[0];
    const context = mainTie ? describe(mainTie) : fit >= 0 ? '運歲五行整體承接喜用' : '運歲五行加重原局偏向';
    const warning = friction >= 4 ? '先處理' + context + '牽動的分工或承諾。' : '';
    let advice = fit < 0 || friction >= 4
      ? warning + '最容易吃虧的是' + mistake + '。先' + action + '。'
      : '可以先' + opportunity + '。也要防' + mistake + '，具體做法是' + correction + '。';
    if (label === '婚姻與伴侶') {
      const traits = {正財:'收支有規律、願意一起負擔日常開銷', 偏財:'善於拓展人脈、工作安排彈性大',
        正官:'守約、重視承諾與生活秩序', 七殺:'行動快、遇到壓力會主動做決定'};
      advice += ' 依傳統配偶星象徵，優先觀察對方是否' + traits[star] +
        '。' + (friction > 0 ? '尤其要確認兩人對工作時間與家庭角色能否談出共識。' : '');
    }
    if (label === '人際與合作' && friction > 0) {
      advice += ' 合作警訊是對方反覆改口、推遲付款或要求你先承擔責任。';
    }
    const basis = (luck ? luck + '大運' : '尚未起運') + '、' + year + '流年' +
      (month ? '、' + month + '流月' : '') + '，原局' + model.state + '／' +
      (model.special || model.ordinary) + '，' + star + '權重由原局 ' +
      ((model.gods[star] || 0) * .55).toFixed(2) + ' 加到 ' + stars[star].toFixed(2) +
      '，大運干／支本氣為' + (luck ? god(model.day, luck[0]) + '／' + god(model.day, branchStems(luck[1])[0]) : '未起運') +
      '，流年干／支本氣為' + god(model.day, year[0]) + '／' + god(model.day, branchStems(year[1])[0]) +
      '。' + context;
    return {label, star, score, advice, basis, opportunity, mistake, correction, friction};
  });
  const find = label => scores.find(score => score.label === label);
  const risks = [
    ['破財警示', roundScore(85 - find('財富').score + stars.劫財 * 4 + find('負債').friction)],
    ['人際衝突警示', roundScore(80 - find('人際與合作').score + stars.傷官 * 4 + find('人際與合作').friction)],
    ['感情摩擦警示', roundScore(85 - find('感情').score + find('感情').friction * 2)]
  ];
  return {luck, year, month, hits, fit, movement, overall: roundScore(base), scores, risks};
}
// 八字核心結束

function taipeiNow() {
  const formatter = new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'Asia/Taipei', year:'numeric', month:'2-digit', day:'2-digit',
    hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'
  });
  return Solar.fromYmdHms(...formatter.format(new Date()).match(/\d+/g).map(Number));
}

function article(parent, title, body, basis) {
  const box = node('article', '');
  box.append(node('h4', title), node('p', body));
  if (basis) box.append(node('small', '命理依據｜' + basis));
  parent.append(box);
}

function graph(parent, points) {
  if (!points.length) return;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 640 185');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', points.map(([year, score]) => year + '年 ' + score + '分').join('，'));
  function mark(tag, attributes, content) {
    const item = document.createElementNS(svg.namespaceURI, tag);
    for (const [key, value] of Object.entries(attributes)) item.setAttribute(key, value);
    item.textContent = content || '';
    svg.append(item);
  }
  for (const score of [0, 50, 100]) {
    const y = 145 - score * 1.15;
    mark('line', {x1:39, x2:620, y1:y, y2:y, stroke:'#e7dacb'});
    mark('text', {x:2, y:y + 4, fill:'#795039', 'font-size':14}, score + '%');
  }
  const positions = points.map(([, score], index) => [52 + index * 55, 145 - score * 1.15]);
  mark('polyline', {points:positions.map(point => point.join(',')).join(' '), fill:'none', stroke:'#A38549', 'stroke-width':3});
  positions.forEach(([x, y], index) => {
    mark('circle', {cx:x, cy:y, r:4, fill:'#795039'});
    mark('text', {x, y:y-8, 'text-anchor':'middle', fill:'#795039', 'font-size':14}, points[index][1] + '%');
    mark('text', {x, y:169, 'text-anchor':'middle', fill:'#795039', 'font-size':14}, points[index][0]);
  });
  const scroller = node('div', '', 'trend');
  scroller.append(svg);
  parent.append(scroller);
}

function renderNatal(out, model) {
  heading(out, '八字本命盤');
  const grid = node('div', '', 'pillars');
  [...model.pillars].reverse().forEach(([stem, branch], index) => {
    const cell = node('div', '', 'pillar' + (index === 1 ? ' day' : ''));
    cell.append(node('b', ['時柱','日柱','月柱','年柱'][index]));
    cell.append(node('small', index === 1 ? '日主' : god(model.day, stem)), colored(stem), colored(branch));
    for (const letter of branchStems(branch)) {
      cell.append(node('small', letter + ' · ' + god(model.day, letter), classes[el(letter)]));
    }
    grid.append(cell);
  });
  out.append(grid);
  const namesOf = elements => elements.map(element => names[element]).join('、') || '無明顯偏向';
  const [primary, secondary] = model.priority;
  const unwanted = model.priority.filter(element => model.preference[element] < -.45);
  const balance = [...model.balanceScore.keys()].sort((a,b) => model.balanceScore[b] - model.balanceScore[a]);
  article(out, model.day + '日主 · ' + model.state,
    '扶助比重 ' + Math.round(model.support * 100) + '%。' + (model.command ? '得令' : '失令') +
    '，同類藏干通根 ' + (model.roots.join('、') || '無') + '，干上印比 ' + model.allies + ' 位。' +
    '五行權重 ' + model.weights.map((weight, index) => names[index] + weight.toFixed(2)).join('、') + '。',
    '月令 ' + model.pillars[1][1] + '，藏干 ' + model.monthStems.join('、') +
    '，月令藏干透出 ' + (model.exposed.join('、') || '無'));
  article(out, '調候、格局與用神',
    '原局' + (model.heat < -1.4 ? '偏寒' : model.heat > 1.4 ? '偏熱' : '寒暖中間') + '、' +
    (model.dryness < -1.4 ? '偏濕' : model.dryness > 1.4 ? '偏燥' : '燥濕中間') +
    '。扶抑候選 ' + (model.state === '中和' && !model.special ? '無明顯偏向' : namesOf(balance.slice(0, 2))) +
    '，調候候選 ' + namesOf(model.climate.map((value,index) => value > 0 ? index : -1).filter(index => index >= 0)) +
    '。綜合用神候選 ' + names[primary] + '，次喜 ' + names[secondary] + '，忌神候選 ' + namesOf(unwanted) + '。',
    (model.special ? model.special + '候選（根氣、透干及集中度門檻）' : model.ordinary + '（月令透干優先）') +
    '，寒熱值 ' + model.heat.toFixed(2) + '，燥濕值 ' + model.dryness.toFixed(2) +
    '。調候採月令與原局火水、燥濕土加權。');
  heading(out, '原局刑沖合化');
  const list = node('ul', '');
  for (const hit of model.hits) list.append(node('li', describe(hit)));
  out.append(model.hits.length ? list : node('p', '此模型未檢出原局完整組合。'));
}

function renderDirections(out, model, current) {
  const directions = ['東','南','東北或西南','西','北'];
  const order = [...model.priority];
  const timed = order.map(element => {
    const fit = model.preference[element];
    const seasonalPressure = current.movement[element];
    return {element, score: fit + (fit < 0 ? -seasonalPressure : Math.min(1.4, seasonalPressure))};
  }).sort((a,b) => b.score - a.score);
  const explain = element => directions[element] + '（' + names[element] +
    '，扶抑與格局 ' + model.balanceScore[element].toFixed(1) + '，調候 ' + model.climate[element].toFixed(1) + '）';
  heading(out, '房屋方位');
  article(out, '長期居住',
    '首選 ' + explain(order[0]) + '，次選 ' + explain(order[1]) + '，相對不建議 ' + explain(order.at(-1)) + '。',
    model.state + '、' + (model.special || model.ordinary) + '，以原局用神合併調候排序。');
  article(out, '階段性選擇',
    '首選 ' + explain(timed[0].element) + '，次選 ' + explain(timed[1].element) +
    '，相對不建議 ' + explain(timed.at(-1).element) + '。',
    (current.luck || '未起運') + '大運與' + current.year + '年使' +
    names[current.movement.indexOf(Math.max(...current.movement))] +
    '的作用最集中。運歲對喜用作加強，對忌神累積作扣分。');
  note(out, '此處是八字五行的方位參考。實際看屋仍需核對門向、採光、通風和現場格局。');
}

function renderAnnual(out, model, year, isCurrent) {
  const terms = solarTerms(year);
  const intervals = slices(model, terms[0], terms[12]);
  if (!intervals.length) return;
  const box = node('details', '', 'annual-card' + (isCurrent ? ' current-year' : ''));
  box.open = isCurrent;
  const phases = intervals.map(interval => ({...interval, result: reading(model, interval.start, {yearAnchor:terms[0]})}));
  box.append(node('summary', year + '年 ' + phases[0].result.year + '｜整體好運 ' +
    phases.map(phase => phase.result.overall + '%').join(' → ') + (isCurrent ? ' · 當年度' : '')));
  for (const phase of phases) {
    const result = phase.result;
    heading(box, keyOf(phase.start) + ' 起 · ' + (result.luck ? result.luck + '大運' : '未起運'));
    const metrics = node('dl', '', 'metrics');
    for (const score of result.scores.slice(0, 9)) {
      metrics.append(node('dt', score.label), node('dd', score.score + '%'));
    }
    for (const [label, score] of result.risks) metrics.append(node('dt', label), node('dd', score + '%'));
    box.append(metrics);
    const tracked = result.scores.slice(0, 9);
    const ranked = [...tracked].sort((a,b) => b.score - a.score);
    const best = ranked[0];
    const worst = ranked.at(-1);
    const nextRisk = ranked.at(-2);
    article(box, '最值得把握 · ' + best.label, '可以先' + best.opportunity + '。' + best.advice, best.basis);
    article(box, '最容易犯的錯 · ' + worst.label, worst.advice, worst.basis);
    article(box, '最不適合 · ' + nextRisk.label, '避免' + nextRisk.mistake + '。' + nextRisk.correction + '。', nextRisk.basis);
  }
  const monthly = node('details', '');
  monthly.append(node('summary', '十二節氣月'));
  function renderMonths() {
    if (monthly.dataset.rendered) return;
    monthly.dataset.rendered = 'true';
    for (let index = 0; index < 12; index++) {
      for (const part of slices(model, terms[index], terms[index + 1])) {
        const result = reading(model, part.start, {monthly:true, yearAnchor:terms[0]});
        const ranked = result.scores.slice(0, 9).sort((a,b) => b.score - a.score);
        const top = ranked[0];
        const low = ranked.at(-1);
        article(monthly, jieNames[index] + ' · ' + result.month + ' · ' + result.overall + '%',
          keyOf(part.start) + ' 起。' + top.label + '：' + top.advice + ' ' + low.label + '：' + low.advice,
          top.basis + '；' + low.basis);
      }
    }
  }
  monthly.addEventListener('toggle', () => {
    if (monthly.open) renderMonths();
  });
  monthly.addEventListener('render-months', renderMonths);
  box.append(monthly);
  out.append(box);
  const duration = (start, end) => Date.parse(keyOf(end).replace(' ', 'T') + '+08:00') -
    Date.parse(keyOf(start).replace(' ', 'T') + '+08:00');
  const total = phases.reduce((sum, phase) => sum + duration(phase.start, phase.end), 0);
  return [year, Math.round(phases.reduce((sum, phase) => sum + phase.result.overall *
    duration(phase.start, phase.end), 0) / total)];
}

function renderReport(out, model, now) {
  renderNatal(out, model);
  heading(out, '十年大運');
  const currentPeriod = activeLuck(model, now);
  note(out, (model.forward ? '順行' : '逆行') + '｜首交運 ' + keyOf(model.start) +
    '｜採 lunar-javascript 第 2 法的節氣分鐘換算。');
  const luckList = node('div', '', 'luck-list');
  const index = currentPeriod ? model.periods.indexOf(currentPeriod) : 0;
  const startIndex = Math.max(0, index - 2);
  for (const period of model.periods.slice(startIndex, startIndex + 10)) {
    const card = node('div', '', 'pillar' + (period === currentPeriod ? ' current-year' : ''));
    card.append(node('b', period === currentPeriod ? '目前大運' : keyOf(period.start).slice(0, 4) + ' 起'),
      colored(period.pillar[0]), colored(period.pillar[1]),
      node('small', keyOf(period.start) + ' 起'), node('small', keyOf(period.end) + ' 交下運'));
    luckList.append(card);
  }
  out.append(luckList);
  if (keyOf(now) < keyOf(model.birth)) note(out, '目前日期早於出生，個人化主題以出生時點試算。');
  const current = reading(model, keyOf(now) < keyOf(model.birth) ? model.birth : now);
  heading(out, '個人主題 · ' + current.year + '流年 × ' + (current.luck ? current.luck + '大運' : '未起運'));
  for (const item of current.scores) article(out, item.label, item.advice, item.basis);
  renderDirections(out, model, current);
  heading(out, '年度好運指數走勢');
  note(out, '百分比是自訂命理傾向評分。交運年分段解讀，折線按各段時長取平均。');
  const plot = node('div', '');
  out.append(plot);
  const year = now.getYear() - (keyOf(now) < keyOf(solarTerms(now.getYear())[0]) ? 1 : 0);
  const firstYear = Math.max(year - 2, model.birth.getYear() -
    (keyOf(model.birth) < keyOf(solarTerms(model.birth.getYear())[0]) ? 1 : 0));
  const points = [];
  for (let y = firstYear; y < firstYear + 10; y++) {
    const point = renderAnnual(out, model, y, y === year);
    if (point) points.push(point);
  }
  graph(plot, points);
  note(out, '使用台灣標準時間 UTC+8。晚子時日柱採當日，未校正歷史夏令時間、真太陽時。格局、合化與調候依本站規則示範。');
  const print = node('button', '列印／儲存 PDF');
  print.type = 'button';
  print.onclick = () => {
    const sections = [...out.querySelectorAll('details')];
    const collapsed = sections.filter(section => !section.open);
    for (const section of sections) {
      section.open = true;
      section.dispatchEvent(new Event('render-months'));
    }
    try {
      window.print();
    } finally {
      for (const section of collapsed) section.open = false;
    }
  };
  out.append(print);
}

document.getElementById('calculate').onclick = () => {
  const form = document.getElementById('profile');
  const out = document.getElementById('chart');
  if (!form.reportValidity()) return;
  out.replaceChildren();
  try {
    const data = Object.fromEntries(new FormData(form));
    if (data.timezone !== 'Asia/Taipei') throw Error('目前試算僅支援 Asia/Taipei');
    if (!window.Solar) throw Error('排盤函式庫載入失敗，請重新整理');
    const [year, month, day] = data.birth_date.split('-').map(Number);
    const [hour, minute, second = 0] = data.birth_time.split(':').map(Number);
    if (year < 1902 || year > 2099) throw Error('測試範圍為 1902 至 2099 年');
    const birth = Solar.fromYmdHms(year, month, day, hour, minute, second);
    renderReport(out, chartModel(birth, data.gender), taipeiNow());
  } catch (error) {
    out.replaceChildren(node('p', '排盤失敗：' + error.message));
  }
};
